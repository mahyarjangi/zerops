zerops:
  - setup: xui
    run:
      base: docker@latest
      ports:
        - port: 2053
          protocol: TCP
          httpSupport: true    # Tells Zerops this port handles web traffic for the panel
        - port: 8443
          protocol: TCP
          httpSupport: false   # Client traffic (VLESS/VMess/Trojan)
      envVariables:
        XRAY_VMESS_AEAD_FORCED: "false"
        TZ: "UTC"
      start: docker run --rm --name 3x-ui -p 2053:2053 -p 8443:8443 -v xui_db:/etc/x-ui -v xui_cert:/root/cert -e XRAY_VMESS_AEAD_FORCED=false -e TZ=UTC bigbugcc/3x-ui:v2.4.5
