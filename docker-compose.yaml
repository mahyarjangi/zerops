services:
  3x-ui:
    image: bigbugcc/3x-ui:v2.4.5  # Use a specific version tag instead of :latest
    container_name: 3x-ui
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/root/cert
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
      - TZ=UTC
