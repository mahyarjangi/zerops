zerops:
  - setup: arad
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker image pull bigbugcc/3x-ui:latest
      start: docker run --rm --name 3x-ui --network=host -v xui_db:/etc/x-ui -v xui_cert:/root/cert -e XRAY_VMESS_AEAD_FORCED=false -e TZ=UTC bigbugcc/3x-ui:latest
      ports:
        - port: 2053
          protocol: TCP
          httpSupport: true
        - port: 8443
          protocol: TCP
          httpSupport: false
